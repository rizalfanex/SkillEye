<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tennis Coach - 聯絡我們</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; color:#1a1a2e; background:#fcfcfc; line-height:1.6; }
        .container { max-width:1200px; margin:0 auto; padding:0 24px; }

        nav {
            position:fixed; top:0; width:100%; background:rgba(255,255,255,0.95);
            backdrop-filter:blur(12px); border-bottom:1px solid rgba(0,0,0,0.04);
            z-index:1000; padding:0 24px;
        }
        nav .container { display:flex; align-items:center; justify-content:space-between; height:56px; }
        .nav-logo { font-weight:800; font-size:1.25rem; letter-spacing:-0.5px; color:#2d6a4f; text-decoration:none; white-space:nowrap; }
        .nav-links { display:flex; gap:20px; list-style:none; align-items:center; }
        .nav-links a { text-decoration:none; color:#1a1a2e; font-size:0.85rem; font-weight:500; transition:color 0.2s; white-space:nowrap; padding:4px 0; border-bottom:2px solid transparent; }
        .nav-links a:hover { color:#2d6a4f; }
        .nav-links a.active { color:#2d6a4f; border-bottom-color:#2d6a4f; }
        .lang-toggle { background:#e8f5e9; border:none; padding:5px 12px; border-radius:20px; font-size:0.8rem; font-weight:600; cursor:pointer; color:#2d6a4f; }
        .lang-toggle:hover { background:#c8e6c9; }
        .mobile-menu-btn { display:none; background:none; border:none; font-size:1.5rem; cursor:pointer; color:#1a1a2e; }

        section { min-height:100vh; display:flex; align-items:center; padding-top:56px; background:#fff; }
        section .container { text-align:center; }
        .section-title { font-size:2.4rem; font-weight:800; margin-bottom:12px; letter-spacing:-1px; }

        .contact-card { background:#f0fdf4; border-radius:32px; padding:60px; max-width:640px; margin:40px auto 0; box-shadow:0 8px 30px rgba(45,106,79,0.08); }
        .contact-card .icon { font-size:4rem; margin-bottom:20px; }
        .contact-card h3 { font-size:1.2rem; font-weight:600; color:#1a1a2e; margin-bottom:8px; }
        .contact-card p { color:#555; font-size:1rem; margin-bottom:28px; }
        .contact-email { display:inline-block; font-size:1.3rem; font-weight:700; color:#2d6a4f; text-decoration:none; padding:14px 36px; background:#fff; border-radius:40px; transition:transform 0.2s; }
        .contact-email:hover { transform:translateY(-2px); }

        .social-links { margin-top:32px; display:flex; justify-content:center; gap:16px; }
        .social-links a { text-decoration:none; color:#888; font-size:0.9rem; transition:color 0.2s; }
        .social-links a:hover { color:#2d6a4f; }

        footer { border-top:1px solid rgba(0,0,0,0.05); padding:32px 0; text-align:center; font-size:0.85rem; color:#888; }

        .lang-zh,.lang-en { transition:opacity 0.2s; }
        .lang-hidden { display:none !important; }
        .nav-links.open { display:flex; flex-direction:column; position:absolute; top:56px; left:0; right:0; background:rgba(255,255,255,0.98); backdrop-filter:blur(12px); padding:20px; gap:14px; border-bottom:1px solid rgba(0,0,0,0.04); }

        @media (max-width: 768px) {
            .nav-links { display:none; }
            .mobile-menu-btn { display:block; }
            .contact-card { padding:36px 24px; }
            .section-title { font-size:1.8rem; }
            .contact-email { font-size:1rem; padding:12px 24px; }
        }
    </style>
</head>
<body>

<div id="siteNav"></div>
<script src="js/skilleye-nav.js"></script>

<section>
    <div class="container">
        <h2 class="section-title lang-zh">聯絡我們</h2>
        <h2 class="section-title lang-en lang-hidden">Contact Us</h2>

        <div class="contact-card">
            <div class="icon">✉️</div>
            <h3 class="lang-zh">有任何問題或建議？</h3>
            <h3 class="lang-en lang-hidden">Questions or suggestions?</h3>
            <p class="lang-zh">我們很樂意聽到你的聲音！歡迎來信</p>
            <p class="lang-en lang-hidden">We'd love to hear from you. Drop us a line!</p>
            <a href="mailto:info@aitenniscoach.com" class="contact-email">info@aitenniscoach.com</a>
            <div class="social-links">
                <a href="#">Instagram</a>
                <a href="#">Facebook</a>
                <a href="#">Twitter</a>
            </div>
        </div>
    </div>
</section>

<footer>
    <div class="container">
        <p class="lang-zh">© 2026 AI Tennis Coach. 為初學者打造的免費 AI 網球教練</p>
        <p class="lang-en lang-hidden">© 2026 AI Tennis Coach. Free AI coach for tennis beginners</p>
    </div>
</footer>

<script>
    const langToggle = document.getElementById('langToggle');
    let currentLang = localStorage.getItem('aiTennisLang') || 'zh';
    const zhElements = document.querySelectorAll('.lang-zh');
    const enElements = document.querySelectorAll('.lang-en');
    function setLang(lang) {
        currentLang = lang;
        localStorage.setItem('aiTennisLang', lang);
        zhElements.forEach(el => { if (lang === 'zh') el.classList.remove('lang-hidden'); else el.classList.add('lang-hidden'); });
        enElements.forEach(el => { if (lang === 'en') el.classList.remove('lang-hidden'); else el.classList.add('lang-hidden'); });
        langToggle.textContent = lang === 'zh' ? 'EN' : '中文';
        document.documentElement.lang = lang === 'zh' ? 'zh-TW' : 'en';
    }
    setLang(currentLang);
    langToggle.addEventListener('click', () => { setLang(currentLang === 'zh' ? 'en' : 'zh'); });
    const mobileBtn = document.getElementById('mobileMenuBtn');
    const navLinks = document.getElementById('navLinks');
    mobileBtn.addEventListener('click', () => { navLinks.classList.toggle('open'); });
    navLinks.querySelectorAll('a').forEach(a => { a.addEventListener('click', () => navLinks.classList.remove('open')); });
</script>

</body>
</html>
